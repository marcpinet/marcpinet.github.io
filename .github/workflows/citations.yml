name: Refresh citation counts

on:
  schedule:
    # Daily, 04:12 UTC. Off the hour on purpose: GitHub queues everything scheduled at
    # :00 together, and a Scholar request from a congested runner is likelier to be met
    # with a captcha.
    - cron: "12 4 * * *"
  workflow_dispatch:

# Only one refresh at a time; a queued run would just race the commit.
concurrency:
  group: citations
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync Google Scholar + Semantic Scholar
    runs-on: ubuntu-latest
    # Backstop only: the script budgets each source itself so a slow Scholar still lets
    # the Semantic Scholar refresh through instead of failing the whole job.
    timeout-minutes: 30
    permissions:
      contents: write   # commit data/citations.json
      actions: write    # trigger the site rebuild below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch citations
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scripts/fetch_citations.py

      - name: Commit if anything changed
        id: commit
        run: |
          # --porcelain, not `git diff`: the file is untracked on a first run, and a
          # plain diff reports no change for a file git has never seen.
          if [ -z "$(git status --porcelain -- data/citations.json)" ]; then
            echo "no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          git commit -m "chore: refresh citation counts [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN deliberately does not trigger other workflows, so
      # the deploy has to be asked for by hand.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main
