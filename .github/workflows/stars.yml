name: Refresh GitHub stars

on:
  schedule:
    # Daily, 05:12 UTC: an hour after the citation refresh, so the two bot pushes to
    # main never race each other.
    - cron: "12 5 * * *"
  workflow_dispatch:

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync stargazer counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit data/github_stars.json
      actions: write    # trigger the site rebuild below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stars.py

      - name: Commit if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/github_stars.json)" ]; then
            echo "no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github_stars.json
          git commit -m "chore: refresh github stars [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN deliberately does not trigger other workflows, so
      # the deploy has to be asked for by hand.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main
